name: shardfall
description: "SHARDFALL - trading card game."
publish_to: 'none'
version: 0.1.23+63

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shardfall_engine:
    path: ../packages/shardfall_engine
  shared_preferences: ^2.3.0
  audioplayers: ^6.1.0
  in_app_purchase: ^3.3.0
  supabase_flutter: ^2.16.0
  google_sign_in: ^7.2.0
  google_mobile_ads: ^9.1.0
  share_plus: ^13.3.0
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

# path_provider_android 2.3.x moved to JNI bindings, which pull in the
# jni_flutter plugin. That plugin fails to configure under this project's
# Gradle/AGP: ":jni_flutter:compileReleaseJavaWithJavac -- Cannot query the
# value of this provider because it has no value available".
#
# It went unnoticed for weeks because incremental builds reused cached Gradle
# state; the break only appears on a clean build, which means the project could
# not be built from scratch -- on CI, or on a new machine. Pinned below 2.3.0
# until the plugin or the toolchain catches up.
dependency_overrides:
  path_provider_android: ">=2.2.0 <2.3.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.3

flutter_native_splash:
  color: "#0B0D12"
  image: assets/ui/app_icon_shardfall.png
  android_12:
    color: "#0B0D12"
    image: assets/ui/app_icon_shardfall_foreground.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/ui/app_icon_shardfall.png"
  adaptive_icon_background: "#0B0D12"
  adaptive_icon_foreground: "assets/ui/app_icon_shardfall_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/art/
    - assets/vo/
    - assets/data/
    - assets/ui/
    - assets/audio/

  fonts:
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel.ttf
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond.ttf
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic
